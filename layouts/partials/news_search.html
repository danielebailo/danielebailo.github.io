<div id="news-search" class="news-search" data-index-url="{{ "news/index.json" | absLangURL }}">
  <label class="news-search-label" for="newsSearchInput">Cerca nelle news</label>
  <div class="news-search-box">
    <svg class="news-search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="newsSearchInput" type="search" placeholder="Cerca per titolo, testo o tag…" autocomplete="off" aria-label="Cerca nelle news">
  </div>
  <p id="newsSearchCount" class="news-search-count" aria-live="polite"></p>
  <div id="newsSearchResults" class="news-search-results" aria-label="Risultati ricerca news"></div>
</div>
